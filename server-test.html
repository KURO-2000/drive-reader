<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuro Reader 서버 연결 테스트</title><style>
body{font:15px/1.6 system-ui,sans-serif;background:#f8f9fb;color:#1d2431;margin:0;padding:28px}main{max-width:760px;margin:auto;background:#fff;padding:24px;border:1px solid #dde1e7;border-radius:14px}input,button{font:inherit;padding:9px 11px;border:1px solid #b6becc;border-radius:7px}input{box-sizing:border-box;width:100%;margin:4px 0 10px}button{cursor:pointer;margin:4px 5px 4px 0;background:#f2f3f5}button:hover{background:#e7ecf4}.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.item{padding:9px 0;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px}.name{flex:1;min-width:0;overflow-wrap:anywhere}.sub{color:#566175;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f8;padding:12px;border-radius:8px}</style></head><body><main>
<h2>Cloudflare 서버 연결 시험</h2><p class="sub">Google 인증키를 입력하는 페이지가 아닙니다. 기기 연결 코드는 서버에만 전송됩니다. <b>테스트 후 GitHub에서 이 파일을 삭제해도 됩니다.</b></p>
<label>Cloudflare Worker 주소</label><input id="base" placeholder="https://kuro-reader-api.xxxxx.workers.dev" autocomplete="off">
<label>최초 기기 연결 코드 (PAIRING_KEY)</label><input id="key" type="password" placeholder="처음 연결할 때만 입력" autocomplete="off">
<div class="row"><button id="pair">① 기기 연결</button><button id="status">② Drive 상태 확인</button><button id="list">③ 소설 목록 보기</button><button id="forget">이 브라우저 연결 해제</button></div>
<p class="sub">시크릿 창은 종료하면 토큰이 사라져 다음에 연결 코드를 다시 입력해야 할 수 있습니다.</p>
<h3>파일 조회 시험</h3><div id="path" class="sub"></div><button id="root">처음 폴더로</button><div id="files"></div>
<h3>시험용 작은 TXT 업로드 (선택)</h3><input id="uploadFile" type="file" accept=".txt,.epub"><button id="upload">업로드 시험</button>
<h3>결과 및 오류</h3><pre id="log">대기 중</pre>
</main><script src="./worker_client.js"></script><script>
'use strict';
const el=id=>document.getElementById(id), log=s=>el('log').textContent=String(s);
let api=null, folder='';
function client(){const url=el('base').value.trim();api=new KuroWorkerClient(url);return api;}
try{el('base').value=localStorage.getItem('kuroWorkerBase')||'';}catch(_){}
async function go(fn){try{log('요청 중...');await fn();}catch(e){log('오류: '+e.message);}}
el('pair').onclick=()=>go(async()=>{const a=client();const code=el('key').value;if(!code)throw Error('기기 연결 코드를 입력하세요.');const r=await a.pair(code,'Kuro site browser');el('key').value='';try{localStorage.setItem('kuroWorkerBase',a.baseURL);}catch(_){}log('기기 연결 성공. 만료 시각: '+new Date(r.expiresAt*1000).toLocaleString());});
el('status').onclick=()=>go(async()=>{const s=await client().status();log(JSON.stringify(s,null,2));});
async function loadFiles(parent=''){
 folder=parent;el('files').replaceChildren();el('path').textContent=parent?'폴더 ID: '+parent:'기본 소설 폴더';const result=await client().files(parent);
 for(const f of result.files||[]){const row=document.createElement('div');row.className='item';const name=document.createElement('span');name.className='name';name.textContent=(f.mimeType==='application/vnd.google-apps.folder'?'📁 ':'📖 ')+f.name;row.append(name);
 const btn=document.createElement('button');btn.textContent=f.mimeType==='application/vnd.google-apps.folder'?'폴더 열기':'읽기 확인';btn.onclick=()=>go(async()=>{
 if(f.mimeType==='application/vnd.google-apps.folder'){await loadFiles(f.id);log('폴더 목록 불러오기 성공');}
 else {const r=await client().download(f.id,'bytes=0-65535');const b=await r.arrayBuffer();log('파일 다운로드 성공: '+f.name+' / '+b.byteLength+' 바이트 읽음 (전체를 다운로드하지 않음)');}
 });row.append(btn);el('files').append(row);
 }
 log('파일 목록 성공: '+(result.files||[]).length+'개'+(result.nextPageToken?' (다음 페이지 있음)':''));
}
el('list').onclick=()=>go(()=>loadFiles());el('root').onclick=()=>go(()=>loadFiles());
el('forget').onclick=()=>{try{client().forget();log('브라우저의 기기 토큰을 삭제했습니다.');}catch(e){log(e.message);}};
el('upload').onclick=()=>go(async()=>{const f=el('uploadFile').files[0];if(!f)throw Error('파일을 먼저 선택하세요.');if(f.size===0)throw Error('빈 파일은 지원하지 않습니다.');if(!confirm('이 파일을 Google Drive 소설 폴더에 시험 업로드할까요?\n'+f.name))return;const r=await client().upload(f,folder,(done,total)=>log(`업로드 중: ${Math.round(done/total*100)}%`));log('업로드 완료: '+JSON.stringify(r));await loadFiles(folder);});
</script></body></html>
