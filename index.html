<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>My Drive Reader</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- EPUB.js -->
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>

<body>

<div id="app">

  <!-- 모바일 상단 -->
  <header class="mobile-header">
    <button id="menuBtn">☰</button>

    <div id="mobileBookTitle">
      My Reader
    </div>

    <button id="settingsBtnMobile">⚙</button>
  </header>


  <!-- 왼쪽 메뉴 -->
  <aside id="sidebar">

    <div class="sidebar-top">

      <div class="logo">
        📚 My Reader
      </div>

      <button id="collapseSidebarBtn" class="sidebar-toggle-btn">
        ◀
      </button>

    </div>


    <button id="googleLoginBtn" class="main-button">
      Google Drive 연결
    </button>


    <div id="loginStatus" class="status">
      연결되지 않음
    </div>


    <button id="settingsBtnDesktop" class="main-button">
      ⚙ 읽기 설정
    </button>


    <label class="upload-button">
      + 책 업로드
      <input
        id="fileInput"
        type="file"
        accept=".txt,.epub"
        multiple
      />
    </label>


    <section class="sidebar-section">

      <div class="section-title">
        내 서재
      </div>

      <input
        id="bookSearch"
        class="search-input"
        placeholder="책 검색"
      />

      <div id="bookList"></div>

    </section>


    <section
      id="tocSection"
      class="sidebar-section hidden"
    >

      <div class="section-title">
        목차
      </div>

      <div id="tocList"></div>

    </section>

  </aside>


  <!-- 본문 -->
  <main id="readerMain">

    <button id="openSidebarBtn" class="open-sidebar-btn hidden">
      ☰
    </button>

    
    <div id="emptyScreen">

      <h1>My Drive Reader</h1>

      <p>
        Google Drive를 연결하고 책을 업로드하세요.
      </p>

    </div>


    <!-- TXT -->
    <div id="txtReader" class="hidden">

      <div class="reader-toolbar">

        <button id="prevChapterBtn">
          ← 이전 장
        </button>

        <div id="chapterTitle">
        </div>

        <button id="nextChapterBtn">
          다음 장 →
        </button>

      </div>


      <div id="txtScrollArea">

        <article id="txtContent">
        </article>

      </div>

    </div>


    <!-- EPUB -->
    <div id="epubReader" class="hidden">

      <div class="reader-toolbar">

        <button id="epubPrevBtn">
          ← 이전
        </button>

        <div id="epubTitle">
        </div>

        <button id="epubNextBtn">
          다음 →
        </button>

      </div>

      <div id="epubViewer"></div>

    </div>

  </main>


  <!-- 설정창 -->
  <div id="settingsPanel" class="settings-panel hidden">

    <div class="settings-header">

      <strong>
        읽기 설정
      </strong>

      <button id="closeSettingsBtn">
        ✕
      </button>

    </div>


    <label>
      배경

      <select id="themeSelect">

        <option value="light">
          밝게
        </option>

        <option value="sepia">
          세피아
        </option>

        <option value="dark">
          어둡게
        </option>

      </select>

    </label>


    <label>

      글자 크기

      <span id="fontSizeValue">
        20px
      </span>

      <input
        id="fontSizeRange"
        type="range"
        min="14"
        max="36"
        value="20"
      />

    </label>


    <label>

      줄 간격

      <span id="lineHeightValue">
        1.9
      </span>

      <input
        id="lineHeightRange"
        type="range"
        min="1.2"
        max="2.8"
        step="0.1"
        value="1.9"
      />

    </label>

  </div>


  <div
    id="overlay"
    class="overlay hidden"
  ></div>

</div>


<script src="app.js"></script>

</body>
</html>
