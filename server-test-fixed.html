<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuro Reader 서버 연결 테스트</title><style>
body{font:15px/1.6 system-ui,sans-serif;background:#f8f9fb;color:#1d2431;margin:0;padding:28px}main{max-width:760px;margin:auto;background:#fff;padding:24px;border:1px solid #dde1e7;border-radius:14px}input,button{font:inherit;padding:9px 11px;border:1px solid #b6becc;border-radius:7px}input{box-sizing:border-box;width:100%;margin:4px 0 10px}button{cursor:pointer;margin:4px 5px 4px 0;background:#f2f3f5}button:hover{background:#e7ecf4}.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.item{padding:9px 0;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px}.name{flex:1;min-width:0;overflow-wrap:anywhere}.sub{color:#566175;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f8;padding:12px;border-radius:8px}</style></head><body><main>
<h2>Cloudflare 서버 연결 시험 (단일 파일 수정본)</h2><p class="sub">기존 JS 파일이 필요 없는 단일 HTML 버전입니다. Google 인증키를 입력하는 페이지가 아닙니다. 기기 연결 코드는 서버에만 전송됩니다. <b>테스트 후 GitHub에서 이 파일을 삭제해도 됩니다.</b></p>
<label>Cloudflare Worker 주소</label><input id="base" placeholder="https://kuro-reader-api.xxxxx.workers.dev" autocomplete="off">
<label>최초 기기 연결 코드 (PAIRING_KEY)</label><input id="key" type="password" placeholder="처음 연결할 때만 입력" autocomplete="off">
<div class="row"><button id="pair">① 기기 연결</button><button id="status">② Drive 상태 확인</button><button id="list">③ 소설 목록 보기</button><button id="forget">이 브라우저 연결 해제</button></div>
<p class="sub">시크릿 창은 종료하면 토큰이 사라져 다음에 연결 코드를 다시 입력해야 할 수 있습니다.</p>
<h3>파일 조회 시험</h3><div id="path" class="sub"></div><button id="root">처음 폴더로</button><div id="files"></div>
<h3>시험용 작은 TXT 업로드 (선택)</h3><input id="uploadFile" type="file" accept=".txt,.epub"><button id="upload">업로드 시험</button>
<h3>결과 및 오류</h3><pre id="log">대기 중</pre>
</main><script>
/* Kuro Reader Cloudflare Worker client, browser non-module.
   Never include GOOGLE_REFRESH_TOKEN, PAIRING_KEY, or OAuth secret in this file.
   Use: const api = new KuroWorkerClient('https://...workers.dev');
   await api.pair(code, 'my PC'); await api.files();
*/
(function () {
  'use strict';
  class KuroWorkerClient {
    constructor(baseURL) {
      this.baseURL = String(baseURL || '').trim().replace(/\/+$/, '');
      if (!/^https:\/\/[^/]+(?:\/.*)?$/i.test(this.baseURL)) throw new Error('https://...workers.dev 형태의 서버 주소를 입력하세요.');
      this.storageKey = 'kuroWorkerDeviceToken:' + this.baseURL;
      this.token = '';
      try { this.token = localStorage.getItem(this.storageKey) || ''; } catch (_) {}
    }
    async call(path, {method='GET', body, headers={}, isRaw=false, allow308=false}={}) {
      const h = new Headers(headers);
      if (this.token) h.set('Authorization', 'Bearer ' + this.token);
      if (body && !(body instanceof Blob) && typeof body !== 'string') {
        h.set('Content-Type', 'application/json');
        body = JSON.stringify(body);
      }
      let r;
      try { r = await fetch(this.baseURL + path, {method,headers:h,body,cache:'no-store'}); }
      catch(e) { throw new Error('서버 연결 실패: ' + e.message + ' (HTTPS/CORS/주소 확인)'); }
      if (!r.ok && !(allow308 && r.status === 308)) {
        let detail = `HTTP ${r.status}`;
        try {
          const type = r.headers.get('Content-Type') || '';
          if (type.includes('json')) { const j=await r.json(); detail=j.error || j.message || detail; }
          else detail = (await r.text()).slice(0,250) || detail;
        } catch (_) {}
        if (r.status === 401) detail += ' — 연결 코드로 다시 기기 등록이 필요합니다.';
        throw new Error(detail);
      }
      return isRaw ? r : r.status === 204 ? null : r.json();
    }
    async pair(key,label='My browser') {
      const data=await this.call('/api/pair',{method:'POST',body:{key,label}});
      if (!/^[a-f0-9]{64}$/.test(data.token || '')) throw new Error('서버 토큰 형식이 올바르지 않습니다.');
      this.token=data.token;
      try { localStorage.setItem(this.storageKey,this.token); } catch(_) {}
      return data;
    }
    forget() {this.token='';try {localStorage.removeItem(this.storageKey);} catch(_) {}}
    status() {return this.call('/api/status');}
    files(parentId='',pageToken='') {
      const q=new URLSearchParams();
      if (parentId) q.set('parent',parentId);
      if (pageToken) q.set('pageToken',pageToken);
      const args=q.toString();
      return this.call('/api/files'+(args?'?'+args:''));
    }
    download(fileId,range='') {
      const headers=range?{'Range':range}:{};
      return this.call('/api/files/'+encodeURIComponent(fileId)+'/content',{headers,isRaw:true});
    }
    makeFolder(name,parentId='') {
      return this.call('/api/folders',{method:'POST',body:{name,...(parentId?{parentId}:{})}});
    }
    rename(fileId,name) {
      return this.call('/api/files/'+encodeURIComponent(fileId),{method:'PATCH',body:{name}});
    }
    move(fileId,parentId) {
      return this.call('/api/files/'+encodeURIComponent(fileId),{method:'PATCH',body:{parentId}});
    }
    trash(fileId) {
      return this.call('/api/files/'+encodeURIComponent(fileId),{method:'DELETE'});
    }
    getProgress(fileId) {
      return this.call('/api/progress/'+encodeURIComponent(fileId));
    }
    saveProgress(fileId,device,position) {
      if (!['web','app'].includes(device)) throw new Error('device는 web 또는 app입니다.');
      return this.call('/api/progress/'+encodeURIComponent(fileId)+'/'+device,{method:'PUT',body:position});
    }
    async upload(file, parentId='', onProgress=null) {
      if (!file || !Number.isSafeInteger(file.size)) throw new Error('올바른 파일을 선택하세요.');
      const begin=await this.call('/api/uploads',{method:'POST',body:{name:file.name,size:file.size,mimeType:file.type||'application/octet-stream',...(parentId?{parentId}:{})}});
      const id=encodeURIComponent(begin.uploadId);
      // Google resumable uploads require non-final chunks in 256KiB multiples.
      const chunkSize=8*1024*1024;
      let pos=0;
      while (pos<file.size) {
        const end=Math.min(file.size,pos+chunkSize);
        const chunk=file.slice(pos,end);
        const headers={'Content-Range':`bytes ${pos}-${end-1}/${file.size}`,'Content-Type':file.type||'application/octet-stream'};
        const res=await this.call('/api/uploads/'+id,{method:'PUT',body:chunk,headers,isRaw:true,allow308:true});
        if (res.status===308) {
          const range=res.headers.get('Range')||'';
          const match=/bytes=0-(\d+)/.exec(range);
          const acknowledged=match?Number(match[1])+1:end;
          if (!Number.isSafeInteger(acknowledged)||acknowledged<=pos) throw new Error('업로드 응답 범위 오류: '+range);
          pos=acknowledged;
        } else if (res.status===200||res.status===201) {
          pos=file.size;
          if (onProgress)onProgress(pos,file.size);
          return res.json();
        } else throw new Error('업로드 중 예상치 못한 응답: '+res.status);
        if (onProgress)onProgress(pos,file.size);
      }
      throw new Error('빈 파일은 이 시험 페이지에서 지원하지 않습니다.');
    }
  }
  window.KuroWorkerClient=KuroWorkerClient;
})();

</script><script>
'use strict';
const el=id=>document.getElementById(id), log=s=>el('log').textContent=String(s);
let api=null, folder='';
function client(){let url=el('base').value.trim();if(url && !/^https?:\/\//i.test(url))url='https://'+url;api=new KuroWorkerClient(url);el('base').value=api.baseURL;return api;}
try{el('base').value=localStorage.getItem('kuroWorkerBase')||'';}catch(_){}
async function go(fn){try{log('요청 중...');await fn();}catch(e){log('오류: '+e.message);}}
el('pair').onclick=()=>go(async()=>{const a=client();const code=el('key').value;if(!code)throw Error('기기 연결 코드를 입력하세요.');const r=await a.pair(code,'Kuro site browser');el('key').value='';try{localStorage.setItem('kuroWorkerBase',a.baseURL);}catch(_){}log('기기 연결 성공. 만료 시각: '+new Date(r.expiresAt*1000).toLocaleString());});
el('status').onclick=()=>go(async()=>{const s=await client().status();log(JSON.stringify(s,null,2));});
async function loadFiles(parent=''){
 folder=parent;el('files').replaceChildren();el('path').textContent=parent?'폴더 ID: '+parent:'기본 소설 폴더';const result=await client().files(parent);
 for(const f of result.files||[]){const row=document.createElement('div');row.className='item';const name=document.createElement('span');name.className='name';name.textContent=(f.mimeType==='application/vnd.google-apps.folder'?'📁 ':'📖 ')+f.name;row.append(name);
 const btn=document.createElement('button');btn.textContent=f.mimeType==='application/vnd.google-apps.folder'?'폴더 열기':'읽기 확인';btn.onclick=()=>go(async()=>{
 if(f.mimeType==='application/vnd.google-apps.folder'){await loadFiles(f.id);log('폴더 목록 불러오기 성공');}
 else {const r=await client().download(f.id,'bytes=0-65535');const b=await r.arrayBuffer();log('파일 다운로드 성공: '+f.name+' / '+b.byteLength+' 바이트 읽음 (전체를 다운로드하지 않음)');}
 });row.append(btn);el('files').append(row);
 }
 log('파일 목록 성공: '+(result.files||[]).length+'개'+(result.nextPageToken?' (다음 페이지 있음)':''));
}
el('list').onclick=()=>go(()=>loadFiles());el('root').onclick=()=>go(()=>loadFiles());
el('forget').onclick=()=>{try{client().forget();log('브라우저의 기기 토큰을 삭제했습니다.');}catch(e){log(e.message);}};
el('upload').onclick=()=>go(async()=>{const f=el('uploadFile').files[0];if(!f)throw Error('파일을 먼저 선택하세요.');if(f.size===0)throw Error('빈 파일은 지원하지 않습니다.');if(!confirm('이 파일을 Google Drive 소설 폴더에 시험 업로드할까요?\n'+f.name))return;const r=await client().upload(f,folder,(done,total)=>log(`업로드 중: ${Math.round(done/total*100)}%`));log('업로드 완료: '+JSON.stringify(r));await loadFiles(folder);});
</script></body></html>
